<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UB Clothes</title>
<meta name="description" content="UB Clothes : friperie digitale, pièces de marques authentiques de seconde main à petits prix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--bg:#fff;--soft:#F5F5F4;--line:#E3E3E0;--muted:#666;--accent:#111}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{font-family:'Archivo',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.logo{font-weight:800;letter-spacing:.5px;text-decoration:none;cursor:pointer}
.right{display:flex;align-items:center;gap:26px}
.links{display:flex;gap:24px;font-size:15px}
.links a{text-decoration:none;color:var(--muted);cursor:pointer}
.links a:hover{color:var(--ink)}
select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.hero{padding:110px 0 90px}
h1{font-size:clamp(38px,6.5vw,68px);line-height:1.05;font-weight:800;letter-spacing:-1.5px;max-width:780px;margin-bottom:24px}
.lead{max-width:520px;color:var(--muted);font-size:19px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-block;padding:14px 24px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;text-decoration:none;border-radius:4px;transition:opacity .2s;cursor:pointer}
.btn:hover{opacity:.8}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{opacity:.6}

/* Style du bandeau de réassurance */
.trust-bar{display:flex;gap:24px;margin-top:40px;padding:16px 20px;background:var(--soft);border-radius:6px;font-size:15px;font-weight:600;flex-wrap:wrap;border:1px solid var(--line)}
.trust-item{display:flex;align-items:center;gap:8px}

/* Blocs catégories Homme / Femme / Enfant */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.cat-card{padding:20px;background:var(--bg);border:1px solid var(--line);border-radius:6px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;transition:transform .2s, border-color .2s}
.cat-card:hover{border-color:var(--ink);transform:translateY(-2px)}

section{padding:80px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.5vw,34px);font-weight:800;letter-spacing:-.5px;margin-bottom:36px}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.points h3{font-size:18px;margin-bottom:8px}
.points p{color:var(--muted)}
.story{background:var(--soft)}
.story .text{max-width:640px}
.story p+p{margin-top:18px}
.cta{text-align:center}
.cta p{color:var(--muted);max-width:520px;margin:0 auto}
.cta .btn{margin-top:28px}
.mail{font-size:20px;font-weight:600;display:inline-block;margin:0 0 6px;text-underline-offset:4px}
.contact p{color:var(--muted);margin-bottom:18px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px}
.item{display:block;text-decoration:none}
.item img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--soft);border-radius:4px;transition:opacity .2s}
.item:hover img{opacity:.85}
.item span{display:block;margin-top:10px;font-weight:600;font-size:15px}
.item small{color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--muted);font-size:14px}

/* Masque du dressing */
.page-dressing #home-content { display: none !important; }
.page-dressing #articles { display: block !important; border-top: none; }

/* Centrage et taille ajustée sur Mobile */
@media (max-width:720px){
  body{font-size:16px}
  .links{display:none}
  .hero{padding:50px 0 40px;text-align:center}
  h1,.lead{margin-left:auto;margin-right:auto}
  .actions{justify-content:center;gap:10px}
  .btn{width:auto;padding:11px 18px;font-size:15px;text-align:center}
  .trust-bar{flex-direction:column;gap:12px;text-align:left}
  .points,.cats{grid-template-columns:1fr;gap:12px}
  section{padding:56px 0}
}
</style>
</head>
<body>
<header>
  <nav class="wrap" aria-label="Navigation">
    <a class="logo" onclick="showHome()">UB CLOTHES</a>
    <div class="right">
      <div class="links">
        <a onclick="showDressing()" data-i="navDressing">Dressing</a>
        <a href="#concept" onclick="showHome()" data-i="nav1">Concept</a>
        <a href="#histoire" onclick="showHome()" data-i="nav2">Histoire</a>
        <a href="#contact" onclick="showHome()" data-i="nav3">Contact</a>
      </div>
      <select id="lang" aria-label="Langue / Language">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
      </select>
    </div>
  </nav>
</header>

<main id="top">
  <!-- Contenu Accueil -->
  <div id="home-content">
    <div class="wrap hero">
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="actions">
        <a class="btn" onclick="showDressing()" data-i="btnDressing">Voir le dressing</a>
        <a class="btn ghost" href="#histoire" data-i="btnStory"></a>
      </div>

      <!-- Bandeau de réassurance -->
      <div class="trust-bar">
        <div class="trust-item">🚚 Envoi rapide sous 24/48h</div>
        <div class="trust-item">✨ Articles 100% authentiques</div>
        <div class="trust-item">🔒 Paiement sécurisé via Vinted</div>
      </div>

      <!-- Section Catégories -->
      <div class="cats">
        <div class="cat-card" onclick="showDressing()" data-i="catHomme">👨 Homme</div>
        <div class="cat-card" onclick="showDressing()" data-i="catFemme">👩 Femme</div>
        <div class="cat-card" onclick="showDressing()" data-i="catEnfant">🧒 Enfant</div>
      </div>
    </div>

    <section id="concept">
      <div class="wrap">
        <h2 data-i="cT"></h2>
        <div class="points">
          <div><h3 data-i="p1t"></h3><p data-i="p1p"></p></div>
          <div><h3 data-i="p2t"></h3><p data-i="p2p"></p></div>
          <div><h3 data-i="p3t"></h3><p data-i="p3p"></p></div>
        </div>
      </div>
    </section>

    <section id="histoire" class="story">
      <div class="wrap">
        <h2 data-i="sT"></h2>
        <div class="text">
          <p data-i="s1"></p>
          <p data-i="s2"></p>
          <p data-i="s3"></p>
        </div>
      </div>
    </section>

    <section class="cta">
      <div class="wrap">
        <h2 data-i="shT"></h2>
        <p data-i="shP"></p>
        <a class="btn" href="https://www.vinted.fr/member/287662659" target="_blank" rel="noopener" data-i="shB"></a>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="wrap">
        <h2 data-i="ctT"></h2>
        <p data-i="ctP"></p>
        <a class="mail" href="mailto:ubclothes.fr@gmail.com">ubclothes.fr@gmail.com</a>
        <div class="actions">
          <a class="btn ghost" href="https://www.vinted.fr/member/287662659" target="_blank" rel="noopener" data-i="ctV"></a>
        </div>
      </div>
    </section>
  </div>

  <!-- Page Dressing isolée -->
  <section id="articles" style="display:none;">
    <div class="wrap">
      <h2 data-i="aT"></h2>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<footer>© 2026 UB Clothes – <span data-i="tag"></span></footer>

(function(){
  if(!ITEMS.length)return;
  var g=document.getElementById('grid');
  ITEMS.forEach(function(it){
    var a=document.createElement('a');
    a.className='item';a.href=it.url;a.target='_blank';a.rel='noopener';
    var im=document.createElement('img');
    im.src=it.img;im.alt=it.name;im.loading='lazy';
    var n=document.createElement('span');n.textContent=it.name;
    a.appendChild(im);a.appendChild(n);
    if(it.price){var pr=document.createElement('small');pr.textContent=it.price;a.appendChild(pr);}
    g.appendChild(a);
  });
})();

function showDressing(){
  document.body.classList.add('page-dressing');
  window.scrollTo(0,0);
}

function showHome(){
  document.body.classList.remove('page-dressing');
}

var sel=document.getElementById('lang');
function apply(l){
  if(!T[l])l='fr';
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=T[l][e.getAttribute('data-i')]});
  sel.value=l;
  try{localStorage.setItem('ub-lang',l)}catch(e){}
}
var start='';
try{start=localStorage.getItem('ub-lang')||''}catch(e){}
if(!start)start=(navigator.language||'fr').slice(0,2);
apply(start);
sel.addEventListener('change',function(){apply(sel.value)});
